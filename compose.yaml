services:
  mercury:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      OPEN_INTELLIGENCE_URL: http://open-intelligence:8000
      RESEARCH_PROOF_URL: http://research-proof:8000
    ports:
      - "3000:3000"
    depends_on:
      open-intelligence:
        condition: service_healthy
      research-proof:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 10s
      retries: 5

  open-intelligence:
    build: services/open-intelligence
    restart: unless-stopped
    env_file: .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5

  research-proof:
    build: services/research-proof
    restart: unless-stopped
    env_file: .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5

  scheduler:
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    depends_on:
      mercury:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - while true; do curl -fsS http://mercury:3000/api/cron/intelligence || true; sleep 60; done
